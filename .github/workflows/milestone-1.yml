name: Milestone 1 Verification

on:
  push:
    branches: ['main', 'milestone-1-vertical-slice']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript verification
        run: bun run lint
      - name: Simulation smoke tests
        run: bun run test:smoke
      - name: Build production bundle
        run: bun run build
